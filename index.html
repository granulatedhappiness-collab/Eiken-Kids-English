<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eiken Kids English</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f5f9ff;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

button{
    padding:10px 15px;
    margin:5px;
    font-size:16px;
}

select,input{
    padding:8px;
    font-size:16px;
}

#chat{
    height:300px;
    overflow-y:auto;
    border:1px solid #ccc;
    padding:10px;
    background:white;
}

.teacher{
    color:blue;
    margin-bottom:10px;
}

.user{
    color:green;
    margin-bottom:10px;
}
</style>
</head>

<body>

<h1>🎓 Eiken Kids English</h1>

<div class="card">

<label>Teacher:</label>

<select id="teacher">
<option value="female">👩 Emma</option>
<option value="male">👨 James</option>
</select>

<br><br>

<label>Level:</label>

<select id="level">
<option value="1">Level 1 (英検5級前半)</option>
<option value="2">Level 2 (英検5級後半)</option>
<option value="3">Level 3 (英検4級前半)</option>
<option value="4">Level 4 (英検4級後半)</option>
</select>

<br><br>

<label>Teacher Speed:</label>

<input
type="range"
id="speed"
min="0.5"
max="1.5"
step="0.1"
value="0.8">

<span id="speedValue">0.8</span>

<br><br>

<button onclick="startLesson()">▶ Start Lesson</button>

<button onclick="repeatTeacher()">🔊 Repeat</button>
<hr>
<div>
⭐ Score: <span id="score">0</span><br><br>
🏅 Badge: <span id="badge">🌱 Beginner</span><br><br>
📈 High Score: <span id="highScore">0</span><br><br>
🔥 Study Days: <span id="studyDays">0</span>
</div>


</div>

<div id="chat"></div>

<div class="card">

<input
id="answer"
style="width:70%;"
placeholder="Gboardの🎤で英語を入力">

<button onclick="sendAnswer()">Send</button>
<button onclick="startSpeechRecognition()">🎤 Speak Answer</button>
<button onclick="showReview()">📖 Review Notebook</button>
<div id="feedback" style="margin-top:10px;"></div>
<div id="reviewArea" style="margin-top:10px;"></div>

</div>

<script>

let speechRate=0.8;

let currentLesson=[];
let currentQuestion=0;

let lastTeacher="";
let score=0;
let highScore=parseInt(localStorage.getItem("highScore")||"0");

const lessons={

1:[
"What is your name?",
"How are you today?",
"What color do you like?",
"What animal do you like?"
],

2:[
"Do you like soccer?",
"What food do you like?",
"Who is in your family?",
"What day is it today?"
],

3:[
"What time do you get up?",
"Can you swim?",
"Where do you study?",
"What do you do after school?"
],

4:[
"What will you do this weekend?",
"What is your favorite subject?",
"Tell me about your hobby.",
"What do you want to be in the future?"
]

};

document.addEventListener("DOMContentLoaded",()=>{
document.getElementById("highScore").textContent=highScore;
let days=parseInt(localStorage.getItem("studyDays")||"0")+1;
localStorage.setItem("studyDays",days);
document.getElementById("studyDays").textContent=days;
});

document
.getElementById("speed")
.addEventListener("input",e=>{

speechRate=parseFloat(e.target.value);

document
.getElementById("speedValue")
.textContent=e.target.value;

});

function addMessage(text,cls){

const div=document.createElement("div");

div.className=cls;

div.textContent=text;

document
.getElementById("chat")
.appendChild(div);

document
.getElementById("chat")
.scrollTop=99999;

}

function speak(text){

const u=new SpeechSynthesisUtterance(text);

u.lang="en-US";

u.rate=speechRate;

speechSynthesis.speak(u);

}

function repeatTeacher(){

if(lastTeacher){

speak(lastTeacher);

}

}

function startLesson(){

document.getElementById("chat").innerHTML="";
score=0;
document.getElementById("score").textContent=0;
document.getElementById("badge").textContent="🌱 Beginner";

currentQuestion=0;

const level=
document.getElementById("level").value;

currentLesson=lessons[level];

askQuestion();

}

function askQuestion(){

const q=currentLesson[currentQuestion];

lastTeacher=q;

addMessage("Teacher: "+q,"teacher");

speak(q);

}

function sendAnswer(){

const box=
document.getElementById("answer");

const text=box.value.trim();

if(!text) return;

addMessage("You: "+text,"user");

box.value="";

if(text.split(" ").length>=3){score+=10;}else{score+=5;}
document.getElementById("score").textContent=score;

let badge="🌱 Beginner";
if(score>=30) badge="⭐ Good Speaker";
if(score>=60) badge="🏅 English Star";
if(score>=90) badge="🏆 Eiken Challenger";
document.getElementById("badge").textContent=badge;

analyzeAnswer(text);

currentQuestion++;

if(currentQuestion<currentLesson.length){

setTimeout(()=>{

askQuestion();

},500);

}else{

addMessage(
"🎉 Lesson Complete!",
"teacher"
);

speak(
"Great job! Lesson complete!"
);

if(score>highScore){
highScore=score;
localStorage.setItem("highScore",highScore);
document.getElementById("highScore").textContent=highScore;
}

}

}


function analyzeAnswer(text){
 let natural=text;
 let reason="Great job!";
 let example=text;

 if(text.toLowerCase().includes("i like dog")){
   natural="I like dogs.";
   reason="dogs のように複数形が自然です。";
   example="I like dogs very much.";
 }

 document.getElementById("feedback").innerHTML=
 "<h3>📚 Teacher Feedback</h3>"+
 "<b>Original:</b> "+text+"<br>"+
 "<b>Natural:</b> "+natural+"<br>"+
 "<b>Reason:</b> "+reason+"<br>"+
 "<b>Example:</b> "+example;

 let notes=JSON.parse(localStorage.getItem("reviewNotes")||"[]");
 notes.push({original:text,natural:natural,reason:reason,example:example});
 localStorage.setItem("reviewNotes",JSON.stringify(notes));
}

function showReview(){
 let notes=JSON.parse(localStorage.getItem("reviewNotes")||"[]");
 let html="<h3>📖 Review Notebook</h3>";
 notes.forEach((n,i)=>{
   html += (i+1)+".<br><b>Original:</b> "+n.original+"<br><b>Natural:</b> "+n.natural+"<br><br>";
 });
 document.getElementById("reviewArea").innerHTML=html;
}

function startSpeechRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){ alert("Speech Recognition is not supported."); return; }
 const rec=new SR();
 rec.lang="en-US";
 rec.onresult=(e)=>{
   document.getElementById("answer").value=e.results[0][0].transcript;
 };
 rec.start();
}

</script>

</body>
</html>
